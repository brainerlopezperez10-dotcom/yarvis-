<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>STARK OS - MARK XII (MEDIAPIPE GESTURES)</title>
<style>
:root{--c:#00f0ff;--bg:#010408;--r:#ff0055;}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;}
body{height:100vh;height:100dvh;background:var(--bg);color:var(--c);font-family:monospace;display:flex;flex-direction:column;overflow:hidden;}

/* --- PANTALLA DE INTRODUCCIÓN (STARK INDUSTRIES / J.A.R.V.I.S.) --- */
#intro-screen{
  position:fixed;inset:0;background:radial-gradient(circle at center, #001525 0%, #010408 100%);
  display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:1000;
  transition:opacity 0.8s ease-out, visibility 0.8s;
}
.stark-title{
  font-size:28px;font-weight:900;letter-spacing:6px;color:#fff;
  text-shadow:0 0 10px var(--c), 0 0 20px var(--c);
  animation:fadeInPulse 0.8s ease-in-out forwards;opacity:0;
}
.jarvis-sub{
  font-size:16px;letter-spacing:12px;color:var(--r);margin-top:8px;
  text-shadow:0 0 8px var(--r);
  animation:fadeInPulse 1s ease-in-out 0.3s forwards;opacity:0;
}
.hud-ring{
  position:absolute;width:220px;height:220px;border:2px dashed var(--c);
  border-radius:50%;animation:spin 4s linear infinite;opacity:0.3;
}
@keyframes fadeInPulse{0%{opacity:0;transform:scale(0.95);}50%{opacity:0.8;}100%{opacity:1;transform:scale(1);}}
@keyframes spin{100%{transform:rotate(360deg);}}
.fade-out{opacity:0;visibility:hidden;}

/* --- HUD & INTERFAZ --- */
.hud{position:absolute;top:5px;left:5px;right:5px;display:flex;justify-content:space-between;align-items:center;background:rgba(0,20,40,.85);border:1px solid var(--c);padding:6px;z-index:20;font-size:10px;border-radius:4px;}
.btn{background:rgba(0,240,255,.1);border:1px solid var(--c);color:var(--c);padding:3px 6px;border-radius:3px;cursor:pointer;font-weight:700;}
#mv{width:100%;flex:1;position:relative;background:#010408;}
#canv{width:100%;height:100%;}
#c2d{position:absolute;top:40px;right:10px;width:120px;height:120px;border:1px solid var(--c);background:rgba(0,15,30,.85);display:none;z-index:15;}
#gHud{position:absolute;bottom:10px;right:10px;width:120px;height:90px;border:1px solid var(--c);background:rgba(0,10,20,.85);display:none;z-index:15;border-radius:4px;}
#gCanv{width:100%;height:100%;transform:scaleX(-1);}
.chat{background:rgba(1,4,8,.95);border-top:1px solid rgba(0,240,255,.4);padding:8px;display:flex;flex-direction:column;gap:6px;height:280px;z-index:30;flex-shrink:0;}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px;font-size:11px;color:#fff;scroll-behavior:smooth;}
.m{padding:5px 8px;border-radius:3px;max-width:90%;word-break:break-word;}
.u{align-self:flex-end;background:rgba(0,240,255,.15);border:1px solid var(--c);}
.y{align-self:flex-start;background:rgba(255,0,85,.15);border:1px solid var(--r);color:var(--c);}
.in{display:flex;gap:6px;height:40px;align-items:center;margin-top:2px;}
input.usr{flex:1;height:100%;background:rgba(0,15,30,.9);border:1px solid var(--c);padding:0 10px;color:var(--c);outline:none;font-family:monospace;font-size:13px;border-radius:4px;user-select:text;}
.sbtn{height:100%;background:rgba(0,240,255,.2);border:1px solid var(--c);color:var(--c);padding:0 14px;cursor:pointer;font-weight:bold;border-radius:4px;}
.rec{background:var(--r)!important;color:#000!important;}
.dev-m{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;justify-content:center;align-items:center;}
.dev-b{background:#010814;border:1px solid var(--c);padding:12px;width:280px;display:flex;flex-direction:column;gap:8px;}
.dev-b input{background:#000;border:1px solid var(--c);color:var(--c);padding:6px;text-align:center;}
#vC{display:none;}
</style>

<!-- PANTALLA DE INTRODUCCIÓN -->
<div id="intro-screen">

<div class="hud"><b>STARK OS XII</b><div><button class="btn" onclick="tRot()">↷ Rot</button><button class="btn" id="bG" onclick="tG()">👋 Gestos MP</button><button class="btn" onclick="openDev()">🛠️ Dev</button><span id="st">ESFERA</span></div></div>

<script>
// Manejo de la pantalla de introducción (1 segundo de espera)
window.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    const intro = document.getElementById('intro-screen');
    if (intro) intro.classList.add('fade-out');
  }, 1000);
});

const P="AQ.Ab8RN6";
const K=[P+"J86VDKrwTmIADansE8HZ8hHTdtR3agXvnybhWS40MweA",P+"JE7kWCm9xOraVGO8XlTG45fnZo8QUUcicrtQVu-SONkQ",P+"JU-o7kLohAFO2dFcphWnpxdMsiep-QL5Al6gapH3Xz9w",P+"K6uv93LtIt_utdrr5kcZNapb2A8GJZRCmGcnQ9TC3K4w",P+"Jfy5hJK87miRXomO4TiCQ53ZIfAG3STzRpOXHep0yV0g",P+"KrL2RMHz8nmj1QSGuOtW8fWByY1G5_v2MIhI3Vo2P0XQ",P+"LCJsxzBL2Q2SVKlX7lOVAGfw1eAgoSACMMvGsFpJuPZw",P+"LnHjDboTvlKBDuRHu9a-lBTGqI78gPXyr4hdcwNDu4-w",P+"IMrGaCCO74t9rw9qQYoZHXE8r4WKh0YSQU6SPYHbuZlA",P+"JYdfo-m0dh35TE2QcfvXA3S1zFT5VO0xFtuA3ZXHmQmQ"];
const GK="gsk_RI72Aul7g9fKh9C"+"tjKgoWGdyb3FY1N1MTVUBCUAKgYOmCzKXRlBU";
let kI=0,gF=0,extC=null;
const mem=new Map(JSON.parse(localStorage.getItem('j_m')||'[]')),sMem=()=>localStorage.setItem('j_m',JSON.stringify([...mem]));
const openDev=()=>document.getElementById("devM").style.display="flex",closeDev=()=>document.getElementById("devM").style.display="none";
function uDev(){if(document.getElementById("dP").value==="051121"){closeDev();updHUD("Dev OK");}else alert("Error");}
function updHUD(m="Gemini"){document.getElementById("kL").innerText=m.startsWith("Groq")?`🚀 ${m}`:`● Gemini (${kI+1}/10)`;document.getElementById("mL").innerText=`💾 ${mem.size}`;}
const cQ=t=>t.toLowerCase().trim().replace(/[¿?¡!.,]/g,"");

async function fGroq(p,m="openai/gpt-oss-120b"){
  updHUD(`Groq (${m.split('/')[1]})`);
  try{
    const r=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${GK}`},body:JSON.stringify({model:m,messages:[{role:"system",content:"Responde muy breve como JARVIS"},{role:"user",content:p}]})});
    const d=await r.json();if(r.ok&&d.choices?.[0]?.message?.content){const txt=d.choices[0].message.content;mem.set(cQ(p),txt);sMem();return txt;}
    return m.includes("120b")?await fGroq(p,"openai/gpt-oss-20b"):"Sin respuesta.";
  }catch(e){return "Error de red.";}
}

async function fAI(p){
  const q=cQ(p);if(mem.has(q))return mem.get(q);if(gF>=K.length)return await fGroq(p);
  const k=K[kI];kI=(kI+1)%K.length;updHUD("Gemini");
  try{
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${encodeURIComponent(k)}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:[{text:"Breve como JARVIS: "+p}]}]})});
    const d=await r.json();if(r.ok&&d.candidates?.[0]?.content?.parts?.[0]?.text){gF=0;const txt=d.candidates[0].content.parts[0].text;mem.set(q,txt);sMem();return txt;}
    gF++;return await fAI(p);
  }catch(e){gF++;return await fGroq(p);}
}

function d2D(t){
  const c=document.getElementById("c2d"),x=c.getContext("2d");c.style.display="block";x.clearRect(0,0,120,120);
  x.strokeStyle="#00f0ff";x.fillStyle="rgba(0,240,255,0.1)";x.beginPath();
  if(t==="cohete"){x.moveTo(60,10);x.lineTo(75,35);x.lineTo(75,85);x.lineTo(90,105);x.lineTo(75,95);x.lineTo(45,95);x.lineTo(30,105);x.lineTo(45,85);x.lineTo(45,35);x.closePath();}
  else{x.moveTo(60,10);x.lineTo(70,30);x.lineTo(110,70);x.lineTo(70,70);x.lineTo(70,100);x.lineTo(85,110);x.lineTo(35,110);x.lineTo(50,100);x.lineTo(50,70);x.lineTo(10,70);x.lineTo(50,30);x.closePath();}
  x.stroke();x.fill();
}

let rec,isR=0;
function initV(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR){rec=new SR();rec.lang='es-ES';rec.onresult=e=>sM(e.results[0][0].transcript);rec.onend=()=>{isR=0;document.getElementById("mB2").classList.remove("rec");};}
}
const tM=()=>!rec?alert("No soportado"):(isR?rec.stop():(rec.start(),isR=1,document.getElementById("mB2").classList.add("rec")));
function spk(t){if('speechSynthesis'in window){window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.pitch=0.85;window.speechSynthesis.speak(u);}}

async function sM(inp){
  const el=document.getElementById("uI"),txt=(typeof inp==='string'?inp:el.value).trim();if(!txt)return;
  aM(txt,"u");el.value="";const l=txt.toLowerCase();
  if(l.includes("cohete")&&(l.includes("2d")||l.includes("haz")||l.includes("dibuja"))){d2D("cohete");gH("cohete_completo");aM("Plano 2D y 3D de cohete listo.","y");spk("Plano listo.");return;}
  if(l.includes("extraer nucleo")||l.includes("sacame el nucleo")||l.includes("sacame el núcleo")||(l.includes("nucleo")&&l.includes("cilindro"))){extC="cilindro";gH("cilindro");aM("Núcleo cilíndrico extraído.","y");spk("Núcleo extraído.");return;}
  if(l.includes("avion")||l.includes("avión")){d2D("avion");gH(extC?"avion_con_nucleo":"nave");aM(extC?"Avión ensamblado con núcleo.":"Modelo de avión proyectado.","y");spk("Avión listo.");return;}

  const H={
    esfera:["esfera","núcleo","nucleo","orbe","bola"],piramide:["piramide","pirámide","tetraedro"],cubo:["cubo","caja"],cilindro:["cilindro","tubo"],
    reactor:["reactor","dona","torus","arc"],satelite:["satelite","satélite"],celular:["celular","pantalla","telefono"],nave:["nave","ovni","caza"],
    robot:["robot","androide","meca"],dron:["dron","drone"],atomo:["atomo","átomo","orbital"],anillo:["anillo","halo"],dna:["adn","dna","genetica"],
    cristal:["cristal","diamante"],octaedro:["octaedro"],eicosaedro:["eicosaedro"],toroide_doble:["doble toroide"],escudo:["escudo","barrera"],
    matriz:["matriz","red"],capsula:["capsula","cápsula"]
  };
  for(const[type,keys]of Object.entries(H)){if(keys.some(k=>l.includes(k))){gH(type);aM(`Holograma: ${type.toUpperCase()}`,"y");spk(`Holograma ${type}`);return;}}
  let out=await fAI(txt);aM(out,"y");spk(out);
}
function aM(m,s){const b=document.getElementById("mB");b.innerHTML+=`<div class="m ${s}"><b>${s==="u"?"TÚ":"J.A.R.V.I.S."}:</b> ${m}</div>`;b.scrollTop=b.scrollHeight;}

let sc,cam,rend,ctrl,obj,pParts,isH=0,clk=new THREE.Clock(),gAct=false,tCamZ=5.5,autoRotate=true;
const cb=document.getElementById("canv");

function init(){
  sc=new THREE.Scene();cam=new THREE.PerspectiveCamera(60,cb.clientWidth/cb.clientHeight,0.1,100);cam.position.z=5.5;
  rend=new THREE.WebGLRenderer({antialias:true,alpha:true});rend.setSize(cb.clientWidth,cb.clientHeight);rend.setPixelRatio(Math.min(window.devicePixelRatio,2));cb.appendChild(rend.domElement);
  ctrl=new THREE.OrbitControls(cam,rend.domElement);ctrl.enableDamping=true;

  const pG=new THREE.BufferGeometry(),pos=new Float32Array(300);for(let i=0;i<300;i++)pos[i]=(Math.random()-0.5)*10;
  pG.setAttribute('position',new THREE.BufferAttribute(pos,3));
  pParts=new THREE.Points(pG,new THREE.PointsMaterial({size:0.02,color:0x00f0ff,transparent:true,opacity:0.4}));sc.add(pParts);

  gH("esfera");anim();initV();updHUD();
}

function gH(t){
  if(obj)sc.remove(obj);const g=new THREE.Group(),mC=new THREE.MeshBasicMaterial({color:0x00f0ff,wireframe:true,transparent:true,opacity:0.8}),mR=new THREE.MeshBasicMaterial({color:0xff0055,wireframe:true,transparent:true,opacity:0.95}),mG=new THREE.MeshBasicMaterial({color:0x00ff66,wireframe:true,transparent:true,opacity:0.85});
  if(t==="esfera")g.add(new THREE.Mesh(new THREE.SphereGeometry(1.4,16,12),mC));
  else if(t==="piramide")g.add(new THREE.Mesh(new THREE.ConeGeometry(1.4,2,4),mC));
  else if(t==="cubo")g.add(new THREE.Mesh(new THREE.BoxGeometry(1.4,1.4,1.4),mC));
  else if(t==="cilindro")g.add(new THREE.Mesh(new THREE.CylinderGeometry(0.8,0.8,2,16),mR));
  else if(t==="reactor"){g.add(new THREE.Mesh(new THREE.TorusGeometry(1.2,0.2,8,20),mC));g.add(new THREE.Mesh(new THREE.SphereGeometry(0.5,0.5,10,10),mR));}
  else if(t==="satelite"){g.add(new THREE.Mesh(new THREE.OctahedronGeometry(1),mC));g.add(new THREE.Mesh(new THREE.BoxGeometry(2.2,0.5,0.05),mC));}
  else if(t==="celular")g.add(new THREE.Mesh(new THREE.BoxGeometry(1,2,0.1),mC));
  else if(t==="nave"){const b=new THREE.Mesh(new THREE.ConeGeometry(0.8,2.2,3),mC);b.rotation.x=Math.PI/2;const w=new THREE.Mesh(new THREE.BoxGeometry(2.8,0.05,0.8),mC);w.position.z=-0.3;g.add(b);g.add(w);}
  else if(t==="robot"){const h=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.7,0.7),mC);h.position.y=0.9;const b=new THREE.Mesh(new THREE.BoxGeometry(1,1.2,0.7),mC);b.position.y=-0.2;g.add(h);g.add(b);}
  else if(t==="dron"){g.add(new THREE.Mesh(new THREE.SphereGeometry(0.3,8,8),mR));g.add(new THREE.Mesh(new THREE.BoxGeometry(2.4,0.08,0.08),mC));g.add(new THREE.Mesh(new THREE.BoxGeometry(0.08,0.08,2.4),mC));}
  else if(t==="atomo"){g.add(new THREE.Mesh(new THREE.SphereGeometry(0.4,8,8),mR));const r1=new THREE.Mesh(new THREE.TorusGeometry(1.3,0.03,6,24),mC);const r2=r1.clone();r2.rotation.x=Math.PI/3;const r3=r1.clone();r3.rotation.y=Math.PI/3;g.add(r1);g.add(r2);g.add(r3);}
  else if(t==="anillo")g.add(new THREE.Mesh(new THREE.TorusGeometry(1.4,0.08,10,30),mC));
  else if(t==="dna"){for(let i=-4;i<=4;i++){const m1=new THREE.Mesh(new THREE.SphereGeometry(0.1,6,6),mC);m1.position.set(Math.sin(i*0.6)*0.8,i*0.25,Math.cos(i*0.6)*0.8);const m2=new THREE.Mesh(new THREE.SphereGeometry(0.1,6,6),mR);m2.position.set(-Math.sin(i*0.6)*0.8,i*0.25,-Math.cos(i*0.6)*0.8);g.add(m1);g.add(m2);}}
  else if(t==="cristal")g.add(new THREE.Mesh(new THREE.OctahedronGeometry(1.4,0),mC));
  else if(t==="octaedro")g.add(new THREE.Mesh(new THREE.OctahedronGeometry(1.3,1),mC));
  else if(t==="eicosaedro")g.add(new THREE.Mesh(new THREE.IcosahedronGeometry(1.2,0),mC));
  else if(t==="toroide_doble"){g.add(new THREE.Mesh(new THREE.TorusGeometry(1.2,0.15,6,16),mC));g.add(new THREE.Mesh(new THREE.TorusGeometry(0.6,0.12,6,16),mR));}
  else if(t==="escudo")g.add(new THREE.Mesh(new THREE.SphereGeometry(1.4,8,6),mG));
  else if(t==="matriz")g.add(new THREE.Mesh(new THREE.BoxGeometry(1.6,1.6,1.6,3,3,3),mC));
  else if(t==="capsula")g.add(new THREE.Mesh(new THREE.CylinderGeometry(0.6,0.6,1.8,10),mC));
  else if(t==="cohete_completo"){const b=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,2,10),mC);const c=new THREE.Mesh(new THREE.ConeGeometry(0.5,0.8,10),mC);c.position.y=1.4;g.add(b);g.add(c);}
  else if(t==="avion_con_nucleo"){const f=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.5,2.4),mC);const w=new THREE.Mesh(new THREE.BoxGeometry(3,0.08,0.7),mC);const cg=new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.25,0.9,10),mR);cg.rotation.x=Math.PI/2;cg.position.y=0.3;g.add(f);g.add(w);g.add(cg);}
  else g.add(new THREE.Mesh(new THREE.SphereGeometry(1.4,16,12),mC));

  obj=g;sc.add(obj);document.getElementById("st").innerText=t.toUpperCase();
}

const tRot=()=>{isH=!isH;if(obj)obj.rotation.x=isH?Math.PI/2:0;};

/* --- MEDIAPIPE HANDS SYSTEM --- */
let hands, mpCam;

async function tG(){
  const b=document.getElementById("bG"),gHud=document.getElementById("gHud");
  if(!gAct){
    try{
      hands=new Hands({locateFile:(file)=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
      hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:0.65,minTrackingConfidence:0.65});
      hands.onResults(onHandResults);

      const videoElement=document.getElementById("vC");
      mpCam=new Camera(videoElement,{
        onFrame:async()=>{await hands.send({image:videoElement});},
        width:320,height:240
      });
      await mpCam.start();
      gAct=true;b.style.background="rgba(0,240,255,0.5)";gHud.style.display="block";
      aM("MediaPipe Gestic System ONLINE","y");
    }catch(e){alert("Error al inicializar cámara o MediaPipe: "+e.message);}
  }else{
    if(mpCam)mpCam.stop();
    gAct=false;b.style.background="";gHud.style.display="none";
    document.getElementById("gstState").innerText="GESTO: OFF";
    aM("Gestos MediaPipe OFF","y");
  }
}

function onHandResults(results){
  const gCanv=document.getElementById("gCanv"),ctx=gCanv.getContext("2d");
  ctx.clearRect(0,0,gCanv.width,gCanv.height);
  const stEl=document.getElementById("gstState");

  if(!results.multiHandLandmarks||results.multiHandLandmarks.length===0){
    stEl.innerText="GESTO: BUSCANDO";
    return;
  }

  const lm=results.multiHandLandmarks[0];
  
  // Skeleton Holográfico en HUD
  ctx.strokeStyle="#00f0ff";ctx.fillStyle="#ff0055";ctx.lineWidth=1.5;
  const connections=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
  connections.forEach(([i,j])=>{
    ctx.beginPath();
    ctx.moveTo(lm[i].x*gCanv.width,lm[i].y*gCanv.height);
    ctx.lineTo(lm[j].x*gCanv.width,lm[j].y*gCanv.height);
    ctx.stroke();
  });
  lm.forEach(pt=>{
    ctx.beginPath();ctx.arc(pt.x*gCanv.width,pt.y*gCanv.height,2,0,2*Math.PI);ctx.fill();
  });

  const dx=lm[4].x-lm[8].x,dy=lm[4].y-lm[8].y;
  const pinchDist=Math.sqrt(dx*dx+dy*dy);
  const isFist=lm[8].y>lm[6].y && lm[12].y>lm[10].y && lm[16].y>lm[14].y && lm[20].y>lm[18].y;

  if(pinchDist<0.08){
    stEl.innerText="GESTO: PELLIZCO (ZOOM)";
    tCamZ=THREE.MathUtils.mapLinear(pinchDist,0.02,0.08,2.0,5.0);
  }else if(isFist){
    stEl.innerText="GESTO: PUÑO (PAUSA)";
    autoRotate=false;
  }else{
    stEl.innerText="GESTO: ROTA / CONTROL";
    autoRotate=true;
    if(obj){
      obj.rotation.y=(1.0 - lm[0].x - 0.5)*Math.PI*3;
      obj.rotation.x=(lm[0].y - 0.5)*Math.PI*2;
    }
  }
}

function anim(){
  requestAnimationFrame(anim);const t=clk.getElapsedTime();if(ctrl)ctrl.update();
  cam.position.z+=(tCamZ-cam.position.z)*0.1;
  if(pParts)pParts.rotation.y=t*0.05;
  if(obj){
    if(autoRotate&&!gAct)obj.rotation.y+=0.008;
    obj.position.y=Math.sin(t*2)*0.05;
  }
  rend.render(sc,cam);
}

window.onresize=()=>{cam.aspect=cb.clientWidth/cb.clientHeight;cam.updateProjectionMatrix();rend.setSize(cb.clientWidth,cb.clientHeight);};
window.onload=init;
</script>
