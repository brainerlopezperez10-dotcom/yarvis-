     DEV + APRENDIZAJE
========================= -->

<script>

function openDev(){

 const panel=
  document.getElementById("devPanel");


 /*
  Si DEV ya está desbloqueado,
  simplemente mostramos/ocultamos
  el panel.
 */

 if(
  typeof devUnlocked!=="undefined" &&
  devUnlocked
 ){

  panel.style.display=
   panel.style.display==="block"
   ? "none"
   : "block";

  updateLearningStatus();

  return;
 }


 const password=
  prompt("🔐 CONTRASEÑA DEV");


 if(password===DEV_PASSWORD){

  if(typeof isDev!=="undefined")
   isDev=true;

  if(typeof devUnlocked!=="undefined")
   devUnlocked=true;

  panel.style.display=
   "block";

  const status=
   document.getElementById(
    "systemStatus"
   );

  if(status)
   status.innerText=
    "DEV ONLINE";

  updateLearningStatus();

 }else{

  alert(
   "❌ Contraseña incorrecta."
  );

 }

}


/* =========================
   APRENDIZAJE
========================= */

function startJarvisLearning(){

 if(
  typeof startLearning!=="function"
 ){

  alert(
   "❌ learning.js no está cargado."
  );

  return;
 }

 /*
  Aprende un tema cada 5 minutos.
 */

 startLearning(5);

 updateLearningStatus();

 aM(
  "🧠 Cerebro de aprendizaje activado.",
  "y"
 );

}


function stopJarvisLearning(){

 if(
  typeof stopLearning==="function"
 )
  stopLearning();

 updateLearningStatus();

 aM(
  "⏹️ Aprendizaje automático detenido.",
  "y"
 );

}


function showJarvisKnowledge(){

 if(
  typeof loadKnowledge!=="function"
 ){

  /*
   learning.js también expone
   getKnowledgeStats/searchKnowledge.
  */

  if(
   typeof getKnowledgeStats!=="function"
  ){

   alert(
    "❌ Cerebro de aprendizaje no disponible."
   );

   return;
  }
 }

 const stats=
  getKnowledgeStats();

 aM(
  `📚 J.A.R.V.I.S. tiene ${stats.topics} conocimientos almacenados.`,
  "y"
 );

}


function showLearningStats(){

 if(
  typeof getKnowledgeStats!=="function"
 ){

  alert(
   "❌ learning.js no está cargado."
  );

  return;
 }

 const stats=
  getKnowledgeStats();

 const db=
  typeof loadKnowledge==="function"
  ? loadKnowledge()
  : [];

 const categories=
  {};

 for(const item of db){

  const cat=
   item.category||
   "general";

  categories[cat]=
   (categories[cat]||0)+1;
 }

 let text=
  "🧠 CEREBRO DE J.A.R.V.I.S.\n\n";

 text+=
  `Conocimientos: ${stats.topics}\n`;

 text+=
  `Aprendizaje: ${
   stats.learning
   ? "ACTIVO"
   : "DETENIDO"
  }\n`;

 text+=
  `Próximo tema: ${stats.nextTopic}\n\n`;

 text+=
  "CATEGORÍAS:\n";

 for(const cat in categories){

  text+=
   `• ${cat}: ${categories[cat]}\n`;
 }

 aM(
  `<pre>${text}</pre>`,
  "y"
 );

}


function clearJarvisKnowledge(){

 const ok=
  confirm(
   "¿Borrar TODO el conocimiento aprendido de J.A.R.V.I.S.?"
  );

 if(!ok)return;

 if(
  typeof clearKnowledge==="function"
 )
  clearKnowledge();

 updateLearningStatus();

 aM(
  "🗑️ Conocimiento local eliminado.",
  "y"
 );

}


/* =========================
   ESTADO DEL CEREBRO
========================= */

function updateLearningStatus(){

 const box=
  document.getElementById(
   "learningStatus"
  );

 if(!box)return;

 if(
  typeof getKnowledgeStats!=="function"
 ){

  box.innerText=
   "Cerebro: no disponible";

  return;
 }

 const stats=
  getKnowledgeStats();

 box.innerText=
  `🧠 Cerebro: ${
   stats.learning
   ? "APRENDIENDO"
   : "DETENIDO"
  } | 📚 ${
   stats.topics
  } conocimientos | 🔜 ${
   stats.nextTopic
  }`;

}


/* Actualización periódica */

setInterval(
 updateLearningStatus,
 3000
);

</script>
