<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010508;color:#dffcff;font-family:Arial}
#app{height:100dvh;max-width:700px;margin:auto;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 20%,#00334133,transparent 35%),#010508}

#header{height:75px;position:absolute;top:0;left:0;right:0;z-index:20;text-align:center;padding:17px;border-bottom:1px solid #00cfff44;background:#020c12dd}
#title{font-size:25px;font-weight:bold;letter-spacing:6px;color:#8df6ff;text-shadow:0 0 15px #00dfff}
#subtitle{font-size:9px;letter-spacing:2px;color:#598f99;margin-top:3px}

#holoArea{position:absolute;top:75px;left:0;right:0;height:44%;overflow:hidden;background:radial-gradient(circle,#00dfff12,transparent 65%)}
#scene{position:absolute;inset:0}
#st{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);padding:5px 13px;border:1px solid #00dfff55;border-radius:20px;background:#00151dcc;color:#72eaff;font-size:9px;letter-spacing:2px;white-space:nowrap}

.holoControls{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:5}
.holoBtn{width:37px;height:37px;border:1px solid #00dfff66;border-radius:50%;background:#001923bb;color:#7eefff;font-size:16px}

#hud{position:absolute;top:12px;left:10px;z-index:5}
.hudItem{font-size:8px;color:#4da8b4;padding:3px 6px;border-left:2px solid #008da6;background:#00101788}
.hudItem b{color:#7cefff}

#chatArea{position:absolute;left:0;right:0;bottom:94px;height:calc(56% - 94px);padding:8px 10px;z-index:10}
#mB{height:100%;overflow-y:auto;padding:7px;border:1px solid #00b4dc2d;border-radius:15px;background:#000b0fcc}

.m{max-width:92%;margin:6px 0;padding:8px 10px;border-radius:10px;font-size:12px;line-height:1.4;word-break:break-word}
.m b{color:#72eaff}
.m.y{border-left:2px solid #00cfff;background:#00506422}
.m.u{margin-left:auto;border-right:2px solid #00aaca;background:#00708c22}

#inputArea{position:absolute;left:8px;right:8px;bottom:8px;height:72px;z-index:30;display:flex;align-items:center;gap:6px;padding:7px;border:1px solid #00c8f04d;border-radius:23px;background:#03151bdd;box-shadow:0 0 20px #00bce815}

.actionBtn,#sendBtn{border:0;border-radius:50%;color:white;cursor:pointer;flex:none}
.actionBtn{width:48px;height:48px;font-size:20px}
#fileBtn{background:#5420bb}
#voiceBtn{background:#00826e}
#voiceBtn.rec{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 25px #00ffdd}}

#msg{flex:1;min-width:0;height:46px;border:1px solid #00dfff55;border-radius:24px;outline:0;padding:0 14px;background:#00141bcc;color:white;font-size:14px}
#sendBtn{width:50px;height:50px;background:#008db5;font-size:21px}

#devBtn{position:absolute;right:10px;top:-40px;height:30px;padding:0 12px;border:1px solid #ff507755;border-radius:16px;background:#23050dcc;color:#ff789b;font-size:9px;font-weight:bold}

#devPanel{position:absolute;inset:0;z-index:100;display:none;overflow-y:auto;padding:13px;background:#010509fa}
#devPanel.active{display:block}
.devHeader{display:flex;justify-content:space-between;align-items:center;padding:8px 2px 13px;border-bottom:1px solid #ff507733;margin-bottom:12px}
.devTitle{color:#ff6e91;font-size:18px;font-weight:bold;letter-spacing:3px}
.devClose{width:38px;height:38px;border:1px solid #ff507766;border-radius:50%;background:#18070c;color:#ff7797;font-size:18px}
.devGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;padding-bottom:25px}
.devCard{min-height:65px;padding:8px;text-align:left;border:1px solid #ff507722;border-radius:11px;background:#210811;color:#ff89a4}
.devIcon{font-size:18px}.devName{display:block;font-size:10px;font-weight:bold;margin-top:3px}.devDesc{display:block;font-size:7px;color:#80616a;margin-top:2px}

#camera{position:absolute;inset:0;z-index:90;display:none;background:#000}
#camera.active{display:block}
#camera video{width:100%;height:100%;object-fit:cover}
.cameraControls{position:absolute;bottom:20px;left:0;right:0;text-align:center}
.cameraBtn{width:55px;height:55px;border:1px solid #00dfff;border-radius:50%;background:#001923dd;color:#7eefff;font-size:20px}

@media(max-width:420px){
#title{font-size:21px;letter-spacing:5px}
.actionBtn{width:44px;height:44px}
#sendBtn{width:47px;height:47px}
#inputArea{height:68px}
}

<script>
const $=id=>document.getElementById(id);

async function enviarMensaje(){

 const input=$("msg");
 const texto=input?.value.trim();

 if(!texto)return;

 try{

   if(typeof processUserMessage==="function"){
     await processUserMessage(texto);
   }else{
     aM("⚠️ El motor de J.A.R.V.I.S. no está disponible.","y");
   }

 }catch(error){

   console.error("J.A.R.V.I.S.:",error);

   aM(
     "⚠️ Error procesando el mensaje: "+
     (error?.message||"error desconocido"),
     "y"
   );

 }

 input.value="";
 input.focus();
}

$("sendBtn").onclick=enviarMensaje;

$("msg").onkeydown=e=>{
 if(e.key==="Enter"){
   e.preventDefault();
   enviarMensaje();
 }
};

$("fileBtn").onclick=()=>$("fileInput").click();

$("fileInput").onchange=e=>{
 const f=e.target.files?.[0];

 if(f&&typeof handleFileInput==="function"){
   handleFileInput(f);
 }

 e.target.value="";
};

window.sM=texto=>{
 if(typeof processUserMessage==="function"){
   processUserMessage(texto);
 }
};

setTimeout(()=>{
 const st=$("st");
 if(st)st.textContent="J.A.R.V.I.S. ONLINE";
},1200);

console.log("J.A.R.V.I.S. MULTI-MODEL ONLINE");
</script>
