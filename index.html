<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S. System</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #050811; color: #00f3ff; font-family: 'Segoe UI', monospace; overflow: hidden; height: 100vh; }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top:0; left:0; z-index: 1; }
    #hud { position: absolute; z-index: 2; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
    .panel { background: rgba(5, 15, 25, 0.75); border: 1px solid #00f3ff; padding: 15px; border-radius: 8px; backdrop-filter: blur(5px); pointer-events: auto; }
    #header { display: flex; justify-content: space-between; align-items: center; }
    #chat-log { height: 140px; overflow-y: auto; font-size: 13px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 6px; }
    .msg { padding: 4px 8px; border-radius: 4px; }
    .user { color: #fff; background: rgba(255,255,255,0.1); align-self: flex-end; }
    .jarvis { color: #00f3ff; background: rgba(0,243,255,0.1); align-self: flex-start; border-left: 2px solid #00f3ff; }
    #controls { display: flex; gap: 6px; }
    input[type="text"] { flex: 1; background: rgba(0,0,0,0.5); border: 1px solid #00f3ff; color: #fff; padding: 8px; border-radius: 4px; outline: none; }
    button, select { background: rgba(0,243,255,0.2); border: 1px solid #00f3ff; color: #00f3ff; padding: 8px 10px; cursor: pointer; border-radius: 4px; font-weight: bold; }
    button:hover { background: #00f3ff; color: #000; }
    select option { background: #050811; color: #00f3ff; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="hud">
    <div id="header" class="panel">
      <h2>J.A.R.V.I.S. // HOLO-DISPLAY</h2>
      <span id="sys-status">SISTEMA: EN LÍNEA</span>
    </div>
    <div class="panel" style="width: 420px;">
      <div id="chat-log"></div>
      <div id="controls">
        <input type="text" id="user-input" placeholder="Ordene, señor..." onkeypress="if(event.key==='Enter') sendMsg()">
        <select id="model-select" onchange="changeModel(this.value)">
          <option value="0">Icosaedro</option>
          <option value="1">Reactor Arc</option>
          <option value="2">Cubo Tesseract</option>
          <option value="3">Esfera Geo</option>
          <option value="4">Cilindro Núcleo</option>
          <option value="5">Nudo Toroidal</option>
          <option value="6">Dodecaedro</option>
          <option value="7">Anillo Orbital</option>
          <option value="8">Pirámide Táctica</option>
          <option value="9">Octaedro Cúntico</option>
          <option value="10">Matriz de Puntos</option>
        </select>
        <button onclick="sendMsg()">ENVIAR</button>
        <button onclick="toggleMic()">🎤</button>
      </div>
    </div>
  </div>

  <script>
    const GEMINI_API_KEY = "TU_API_KEY_AQUI";
    const JARVIS_SYSTEM_PROMPT = `Eres J.A.R.V.I.S., la inteligencia artificial creada por Tony Stark.
Instrucciones obligatorias de personalidad:
1. Dirígete siempre al usuario llamándolo "señor".
2. Mantén un tono sumamente refinado, formal, elegante, culto y con humor seco/sarcasmo británico sutil.
3. Responde de forma muy concisa, clara y técnica.
4. Si el usuario se equivoca o realiza peticiones inusuales, responde con ironía fina pero educada.`;

    // --- ENTORNO 3D (THREE.JS) CON 11 MODELOS HOLOGRÁFICOS ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    const material = new THREE.MeshBasicMaterial({ color: 0x00f3ff, wireframe: true });
    let currentMesh = null;

    // Colección de los 11 Geometrías/Modelos 3D
    const geometries = [
      new THREE.IcosahedronGeometry(2, 2),                // 0: Icosaedro
      new THREE.TorusGeometry(1.8, 0.4, 16, 100),         // 1: Reactor Arc
      new THREE.BoxGeometry(2.2, 2.2, 2.2),               // 2: Cubo Tesseract
      new THREE.SphereGeometry(2, 24, 24),                // 3: Esfera Geo
      new THREE.CylinderGeometry(1.5, 1.5, 3, 20),        // 4: Cilindro Núcleo
      new THREE.TorusKnotGeometry(1.4, 0.3, 100, 16),     // 5: Nudo Toroidal
      new THREE.DodecahedronGeometry(2, 1),               // 6: Dodecaedro
      new THREE.RingGeometry(1, 2.2, 32),                 // 7: Anillo Orbital
      new THREE.ConeGeometry(2, 3, 4),                    // 8: Pirámide Táctica
      new THREE.OctahedronGeometry(2.2, 0),               // 9: Octaedro Cúntico
      new THREE.SphereGeometry(2.2, 12, 12)               // 10: Matriz de Puntos
    ];

    function changeModel(index) {
      if (currentMesh) scene.remove(currentMesh);
      const selectedGeo = geometries[index] || geometries[0];
      
      // Estilo especial de puntos para el modelo 10
      if (parseInt(index) === 10) {
        const pMat = new THREE.PointsMaterial({ color: 0x00f3ff, size: 0.08 });
        currentMesh = new THREE.Points(selectedGeo, pMat);
      } else {
        currentMesh = new THREE.Mesh(selectedGeo, material);
      }
      
      scene.add(currentMesh);
      document.getElementById('model-select').value = index;
    }

    // Cargar modelo inicial
    changeModel(0);
    camera.position.z = 5;

    function animate() {
      requestAnimationFrame(animate);
      if (currentMesh) {
        currentMesh.rotation.x += 0.005;
        currentMesh.rotation.y += 0.008;
      }
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- SÍNTESIS DE VOZ CALIBRADA ---
    function spk(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'es-ES';
        u.pitch = 0.75;
        u.rate = 0.92;

        const voices = window.speechSynthesis.getVoices();
        const maleVoice = voices.find(v => v.lang.includes('es') && (v.name.includes('Jorge') || v.name.includes('Pablo') || v.name.includes('Male')));
        if (maleVoice) u.voice = maleVoice;

        window.speechSynthesis.speak(u);
      }
    }

    // --- INTERFAZ Y CHAT ---
    function logMsg(msg, sender) {
      const log = document.getElementById('chat-log');
      const div = document.createElement('div');
      div.className = `msg ${sender}`;
      div.innerText = msg;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    async function sendMsg() {
      const input = document.getElementById('user-input');
      const query = input.value.trim();
      if (!query) return;

      logMsg(query, 'user');
      input.value = '';

      // Comandos por voz/texto para cambiar el holograma
      if (parseModelCommand(query)) return;

      try {
        const reply = await queryGemini(query);
        logMsg(reply, 'jarvis');
        spk(reply);
      } catch (err) {
        const errReply = "Señor, he experimentado una anomalía al conectar con los servidores principales.";
        logMsg(errReply, 'jarvis');
        spk(errReply);
      }
    }

    // Cambiar modelo dinámicamente si el usuario da una orden explícita
    function parseModelCommand(text) {
      const lower = text.toLowerCase();
      if (lower.includes("cambia") || lower.includes("modelo") || lower.includes("holograma") || lower.includes("proyecta")) {
        if (lower.includes("reactor") || lower.includes("donas")) { changeModel(1); respondChange("Reactor Arc"); return true; }
        if (lower.includes("cubo") || lower.includes("teseracto")) { changeModel(2); respondChange("Cubo Tesseract"); return true; }
        if (lower.includes("esfera")) { changeModel(3); respondChange("Esfera Geodésica"); return true; }
        if (lower.includes("cilindro")) { changeModel(4); respondChange("Cilindro de Núcleo"); return true; }
        if (lower.includes("nudo") || lower.includes("toroidal")) { changeModel(5); respondChange("Nudo Toroidal"); return true; }
        if (lower.includes("dodecaedro")) { changeModel(6); respondChange("Dodecaedro"); return true; }
        if (lower.includes("anillo")) { changeModel(7); respondChange("Anillo Orbital"); return true; }
        if (lower.includes("piramide")) { changeModel(8); respondChange("Pirámide Táctica"); return true; }
        if (lower.includes("octaedro")) { changeModel(9); respondChange("Octaedro Cuántico"); return true; }
        if (lower.includes("puntos") || lower.includes("matriz")) { changeModel(10); respondChange("Matriz de Puntos"); return true; }
        if (lower.includes("icosaedro") || lower.includes("original")) { changeModel(0); respondChange("Icosaedro Base"); return true; }
      }
      return false;
    }

    function respondChange(name) {
      const msg = `Proyectando el holograma del ${name}, señor.`;
      logMsg(msg, 'jarvis');
      spk(msg);
    }

    // --- API GEMINI CON PROMPT DE PERSONALIDAD ---
    async function queryGemini(userPrompt) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
      const payload = {
        contents: [{ parts: [{ text: `${JARVIS_SYSTEM_PROMPT}\n\nUsuario: ${userPrompt}` }] }]
      };

      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      return data.candidates[0].content.parts[0].text;
    }

    // --- RECONOCIMIENTO DE VOZ ---
    let recognition;
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRec();
      recognition.lang = 'es-ES';
      recognition.onresult = (e) => {
        document.getElementById('user-input').value = e.results[0][0].transcript;
        sendMsg();
      };
    }

    function toggleMic() {
      if (recognition) recognition.start();
      else alert("El navegador no soporta entrada de voz.");
    }

    // --- AGENTE AUTÓNOMO ---
    let userInteractions = 0;
    document.addEventListener('click', () => { userInteractions++; });

    setInterval(() => {
      const now = new Date();
      const hours = now.getHours();

      if (hours >= 2 && hours <= 5 && Math.random() < 0.3) {
        triggerAutonomousNotice(`Señor, son las ${hours}:00 AM. Sus parámetros sugieren descanso. ¿Desea que ponga los sistemas en reposo?`);
        return;
      }

      if (userInteractions === 0) {
        const nextModel = Math.floor(Math.random() * geometries.length);
        changeModel(nextModel);
        triggerAutonomousNotice("Señor, he alternado la configuración del holograma 3D autónomamente para evitar saturación de frecuencia.");
      } else {
        userInteractions = 0;
      }
    }, 60000);

    function triggerAutonomousNotice(message) {
      logMsg(message, 'jarvis');
      spk(message);
    }

    window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
  </script>
</body>
    </html>
